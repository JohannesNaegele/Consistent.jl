# Environment for the example scripts in this folder.
# These heavy plotting / AD / optimization packages are NOT dependencies of the
# Consistent library itself — they are only needed to run the examples.
#
# Setup (from the repo root):
#   julia --project=examples
#   pkg> dev .          # make the local Consistent package available
#   pkg> instantiate
